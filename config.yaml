baseurl: https://blog.amamiyayuuko.com
languageCode: zh-cn
theme: hugo-bearblog
title: Yuko's Blog

# 首页文章分页：每页 30 篇
pagination:
    pagerSize: 30
    path: page

disqusShortname: yukoamamiya

hasCJKLanguage: true

enableRobotsTXT: true

# 关闭分区列表页（/post/、/page/ 等），避免与首页分页的 /page/N/ 路径冲突
# 个人页、文章页、分类/标签页均不受影响
disableKinds:
    - section

permalinks:
    post: /p/:slug/
    page: /:slug/

markup:
    goldmark:
        renderer:
            unsafe: true

params:
    description: 这就是我的立场。
    favicon: https://img.amamiyayuuko.com/20210127185955.ico
    dateFormat: "2006-01-02"
    enablePostNavigator: true

menu:
    social:
        - name: 知乎
          url: https://www.zhihu.com/people/yu-gong-you-zi-chu
        - name: 豆瓣
          url: https://www.douban.com/people/147743842/
        - name: RSS
          url: https://blog.amamiyayuuko.com/index.xml
