baseurl: https://blog.amamiyayuuko.com
languageCode: zh-cn
theme: hugo-bearblog
title: Yuko's Blog

# 首页文章分页：每页 30 篇
pagination:
    pagerSize: 30
    path: page

disqusShortname: yukoamamiya

hasCJKLanguage: true

enableRobotsTXT: true

# 压缩输出 HTML/CSS/JS/JSON，减小页面体积
minify: true

# 关闭分区列表页（/post/、/page/ 等），避免与首页分页的 /page/N/ 路径冲突
# 个人页、文章页、分类/标签页均不受影响
disableKinds:
    - section

permalinks:
    post: /p/:slug/
    page: /:slug/

markup:
    goldmark:
        renderer:
            unsafe: true

params:
    description: 这就是我的立场。
    favicon: https://img.amamiyayuuko.com/20210127185955.ico
    dateFormat: "2006-01-02"
    enablePostNavigator: true
    author: 雨宫优子
    images:
        - https://blog.amamiyayuuko.com/img/avatar_kisaki.jpg

    # 统计与分析（enabled: false 即整体关闭该功能）
    googleAnalytics:
        enabled: true
        id: G-7F6V3SKFKX
        proxy: https://ga.amamiyayuuko.com/
    cloudflareWebAnalytics:
        enabled: true
        token: 0a652835cf504598804ceb55ad0b9f82

    # 评论（DisqusJS，shortname 沿用顶层 disqusShortname）
    disqusjs:
        enabled: true
        apiUrl: https://disqus-api.amamiyayuuko.com/api/
        apiKey: W4tjEgaiCuVivojE9FEf43urT1YnfX0KzTkmdbYyMsfL2ZG3dDKZvsybWqkDgJUh

    # 豆瓣最近书影音（About 页徽章，enabled: false 即关闭）
    doubanBadge:
        enabled: true
        uid: 147743842

