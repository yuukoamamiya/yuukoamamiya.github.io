<style>
  :root {
    --width: 720px;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-secondary: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
    --font-scale: 1.0625em;
    --background-color: #fff;
    --heading-color: #111;
    --text-color: #1f2328;
    --link-color: #1a5fb4;
    --visited-color: #8b6fcb;
    --blockquote-color: #3a3f44;
    --muted-color: #595959;
    --code-background: #f4f4f4;
    --border-color: #e2e2e2;
  }

  /* OS 深色自动跟随（不支持 prefers-color-scheme 的旧浏览器自动忽略，保持浅色） */
  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #0f1417;
      --heading-color: #eee;
      --text-color: #d6d6d6;
      --link-color: #8cc2dd;
      --visited-color: #9a8cc9;
      --blockquote-color: #c8c8c8;
      --muted-color: #a6a6a6;
      --code-background: #1b2329;
      --border-color: #2a3238;
    }
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scrollbar-gutter: stable;
  }
  @supports not (scrollbar-gutter: stable) {
    html { overflow-y: scroll; }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    line-height: 1.7;
    margin: 0 auto;
    padding: 1.25rem;
    max-width: var(--width);
    background-color: var(--background-color);
    color: var(--text-color);
    text-align: left;
    word-wrap: break-word;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  content { display: block; }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
    line-height: 1.3;
    margin: 1.6em 0 0.6em;
  }

  h1 { font-size: 1.6em; }
  h2 { font-size: 1.35em; }
  h3 { font-size: 1.18em; }
  h4, h5, h6 { font-size: 1em; }

  a { color: var(--link-color); cursor: pointer; }

  nav a { text-decoration: none; margin-right: 8px; }
  nav a:hover { text-decoration: underline; }

  content a {
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--link-color) 45%, transparent);
    text-underline-offset: 0.22em;
  }
  content a:hover { text-decoration-color: var(--link-color); }

  strong, b { color: var(--heading-color); }

  button { margin: 0; cursor: pointer; }

  time {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.9em;
    color: var(--muted-color);
  }

  main { line-height: 1.75; }

  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--border-color); padding: 0.4em 0.6em; text-align: left; }

  hr { border: 0; border-top: 1px dashed var(--border-color); }

  img { max-width: 100%; height: auto; }

  /* 懒加载图片在加载前按平均比例(约4:3)预留空间，避免布局抖动(CLS)；
     aspect-ratio: auto 表示加载后用真实比例，不拉伸变形 */
  content img { aspect-ratio: auto 4 / 3; }

  code {
    font-family: var(--font-mono);
    background: var(--code-background);
    padding: 0.15em 0.35em;
    border-radius: 4px;
    font-size: 0.9em;
  }

  pre {
    background: var(--code-background);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 0.9em 1em;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; border: 0; border-radius: 0; font-size: 0.9em; }

  blockquote {
    border-left: 3px solid var(--border-color);
    color: var(--blockquote-color);
    margin: 1em 0;
    padding: 0.1em 0 0.1em 1em;
  }

  footer {
    padding: 2rem 0;
    text-align: center;
    color: var(--muted-color);
    font-size: 0.9em;
  }
  footer a { color: var(--muted-color); }

  .title:hover { text-decoration: none; }
  .title h1 { font-size: 1.5em; }

  .inline { width: auto !important; }

  .highlight { border-radius: 6px; margin: 1em 0; overflow-x: auto; }
  .highlight pre, .code pre { min-width: 100%; width: max-content; }

  /* table of contents */
  .toc {
    margin: 1.2em 0 1.8em;
    padding: 0.8em 1em 0.9em;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: color-mix(in srgb, var(--code-background) 55%, transparent);
  }
  .toc summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--heading-color);
  }
  .toc nav > ul { margin: 0.6em 0 0; padding-left: 1.2em; }
  .toc ul { list-style: disc; }
  .toc ul ul { margin: 0.2em 0; }
  .toc li { margin: 0.25em 0; }
  .toc a { text-decoration: none; }
  .toc a:hover { text-decoration: underline; }

  /* blog post list */
  ul.blog-posts { list-style-type: none; padding: unset; }
  ul.blog-posts li { display: flex; margin: 0.3em 0; }
  ul.blog-posts li span { flex: 0 0 130px; }
  ul.blog-posts li a { color: var(--text-color); text-decoration: none; }
  ul.blog-posts li a:hover { color: var(--link-color); text-decoration: underline; }
  ul.blog-posts li a:visited { color: var(--visited-color); }

  .pagination { margin: 2em 0; }
  .search-status, .search-count { color: var(--muted-color); font-size: 0.9em; }
  #searchInput {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5em;
    font-size: 1em;
    margin-bottom: 1em;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    background: var(--background-color);
    color: var(--text-color);
  }
  .links .link { margin: 1.5em 0; padding-bottom: 1em; border-bottom: 1px dashed var(--border-color); }
  .links .link:last-child { border-bottom: none; }
  .links .link h3 { margin-bottom: 0.3em; }
  .taxonomy-list { list-style: none; padding: 0; }
  .taxonomy-list li { margin: 0.5em 0; }
  .taxonomy-count { color: var(--muted-color); font-size: 0.85em; margin-left: 0.5em; }
  .taxonomy-description { color: var(--text-color); margin-top: 0; }

  a:focus-visible, summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  ::selection { background: color-mix(in srgb, var(--link-color) 30%, transparent); }

  @media print {
    body { max-width: none; }
    nav, footer, .toc { display: none; }
  }

  @media (max-width: 480px) {
    body { padding: 0.9rem; }
    ul.blog-posts li { flex-direction: column; gap: 0.1em; }
    ul.blog-posts li span { flex: none; }
  }

  /* DisqusJS 适配（自带 CSS 为浅色主题，这里改用主题变量，深浅色 / 手动切换都跟随） */
  #disqusjs #dsqjs .dsqjs-post-body,
  #disqusjs #dsqjs .dsqjs-no-comment,
  #disqusjs #dsqjs .dsqjs-nav-tab,
  #disqusjs #dsqjs .dsqjs-tab-active,
  #disqusjs #dsqjs .dsqjs-post-header .dsqjs-post-author,
  #disqusjs #dsqjs .dsqjs-meta,
  #disqusjs #dsqjs .dsqjs-footer {
    color: var(--text-color);
  }
  #disqusjs #dsqjs a {
    color: var(--link-color);
  }
  #disqusjs #dsqjs .dsqjs-nav,
  #disqusjs #dsqjs .dsqjs-footer-container {
    border-color: var(--border-color);
  }
  #disqusjs #dsqjs .dsqjs-post-avatar {
    background: var(--border-color);
  }
  #disqusjs #dsqjs .dsqjs-order-label {
    background-color: var(--border-color);
    color: var(--text-color);
  }
  #disqusjs #dsqjs .dsqjs-order-radio:checked + .dsqjs-order-label {
    background-color: var(--muted-color);
  }
  #disqusjs #dsqjs .dsqjs-load-more {
    background: var(--muted-color);
  }
  #disqusjs #dsqjs .dsqjs-load-more.is-error {
    background: #b33a3a;
  }
  #disqusjs #dsqjs .dsqjs-post-body :not(pre) > code {
    background: var(--code-background);
    color: var(--text-color);
  }
</style>
