{{ define "main" }}
<h1>{{ .Title }}</h1>
<content>
    <input type="search" id="searchInput" placeholder="输入关键词搜索…" />
    <p id="searchStatus" class="search-status">输入关键词开始搜索</p>
    <div id="searchResults"></div>
</content>
{{ $version := now.Unix }}
<script>
    (function () {
        var version = {{ $version }};
        var indexUrl = '{{ with .OutputFormats.Get "json" }}{{ .RelPermalink }}{{ end }}';
        var input = document.getElementById('searchInput');
        var status = document.getElementById('searchStatus');
        var results = document.getElementById('searchResults');
        var entries = [];
        var ready = false;
        var loading = false;
        var debounceTimer = null;

        var DB_NAME = 'search-index';
        var DB_STORE = 'cache';
        var DB_KEY = 'index';
        var MAX_RESULTS = 100;
        var SNIPPET_RADIUS = 50;

        function openDB() {
            return new Promise(function (resolve, reject) {
                if (!window.indexedDB) { reject(new Error('indexedDB unavailable')); return; }
                var req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function () {
                    var db = req.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE);
                    }
                };
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error); };
            });
        }

        function dbGet(db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(DB_STORE, 'readonly');
                var r = tx.objectStore(DB_STORE).get(DB_KEY);
                r.onsuccess = function () { resolve(r.result || null); };
                r.onerror = function () { reject(r.error); };
            });
        }

        function dbPut(db, value) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(value, DB_KEY);
                tx.oncomplete = function () { resolve(); };
                tx.onerror = function () { reject(tx.error); };
            });
        }

        function escapeHtml(s) {
            return (s == null ? '' : String(s))
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeRegExp(s) {
            return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlight(text, terms) {
            var out = escapeHtml(text);
            for (var i = 0; i < terms.length; i++) {
                out = out.replace(new RegExp(escapeRegExp(terms[i]), 'gi'), function (m) {
                    return '<mark>' + m + '</mark>';
                });
            }
            return out;
        }

        function buildEntries(posts) {
            return posts.map(function (p) {
                var tax = [].concat(p.tags || [], p.categories || []).join(' ');
                var low = {
                    title: (p.title || '').toLowerCase(),
                    tax: tax.toLowerCase(),
                    desc: (p.description || '').toLowerCase(),
                    content: (p.content || '').toLowerCase()
                };
                return {
                    p: p,
                    low: low,
                    combined: [low.title, low.tax, low.desc, low.content].join(' ')
                };
            });
        }

        function makeSnippet(p, low, terms) {
            var src = p.content || '';
            var best = -1, bestTerm = null;
            for (var i = 0; i < terms.length; i++) {
                var idx = low.content.indexOf(terms[i]);
                if (idx !== -1 && (best === -1 || idx < best)) {
                    best = idx;
                    bestTerm = terms[i];
                }
            }
            var text;
            if (best !== -1 && src) {
                var start = Math.max(0, best - SNIPPET_RADIUS);
                var end = Math.min(src.length, best + bestTerm.length + SNIPPET_RADIUS);
                text = (start > 0 ? '…' : '') + src.slice(start, end) + (end < src.length ? '…' : '');
            } else {
                text = p.description || '';
            }
            return text ? highlight(text, terms) : '';
        }

        function render(hits, terms) {
            if (!hits.length) {
                results.innerHTML = '<p>无结果</p>';
                return;
            }
            results.innerHTML = hits.map(function (e) {
                var p = e.p;
                var tags = [].concat(p.tags || []).map(escapeHtml).join(' #');
                var cats = [].concat(p.categories || []).map(escapeHtml).join(' / ');
                var snip = makeSnippet(p, e.low, terms);
                return '<p><a href="' + escapeHtml(p.url) + '">' + highlight(p.title || '', terms) + '</a><br />' +
                    '<small>' + escapeHtml(p.date || '') +
                    (cats ? ' · ' + cats : '') +
                    (tags ? ' · # ' + tags : '') +
                    '</small>' +
                    (snip ? '<br /><span class="search-snippet">' + snip + '</span>' : '') +
                    '</p>';
            }).join('') + '<p class="search-count">共 ' + hits.length + ' 条结果</p>';
        }

        function search(q) {
            if (!ready) return;
            var raw = (q || '').trim();
            if (!raw) {
                results.innerHTML = '';
                return;
            }
            var terms = raw.toLowerCase().split(/\s+/).filter(function (t) { return t; });
            if (!terms.length) {
                results.innerHTML = '';
                return;
            }
            var scored = [];
            for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                var ok = true;
                for (var j = 0; j < terms.length; j++) {
                    if (e.combined.indexOf(terms[j]) === -1) { ok = false; break; }
                }
                if (!ok) continue;
                var score = 0;
                for (var k = 0; k < terms.length; k++) {
                    var t = terms[k];
                    if (e.low.title.indexOf(t) !== -1) score += 3;
                    if (e.low.tax.indexOf(t) !== -1) score += 2;
                    if (e.low.desc.indexOf(t) !== -1) score += 2;
                    if (e.low.content.indexOf(t) !== -1) score += 1;
                }
                scored.push({ p: e.p, low: e.low, score: score, date: e.p.date || '' });
            }
            scored.sort(function (a, b) {
                if (b.score !== a.score) return b.score - a.score;
                return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
            });
            render(scored.slice(0, MAX_RESULTS), terms);
        }

        function fetchIndex() {
            return fetch(indexUrl + '?v=' + version)
                .then(function (resp) { return resp.json(); })
                .then(function (posts) {
                    entries = buildEntries(posts);
                    return { count: posts.length };
                });
        }

        function ensureReady() {
            if (ready || loading) return;
            loading = true;
            status.textContent = '正在加载索引…';
            openDB()
                .then(function (db) {
                    return dbGet(db).then(function (cached) {
                        if (cached && cached.version === version && Array.isArray(cached.entries)) {
                            entries = cached.entries;
                            ready = true;
                            status.textContent = '已从缓存加载（' + entries.length + ' 篇文章）';
                            db.close();
                            search(input.value);
                            return;
                        }
                        return fetchIndex().then(function (r) {
                            ready = true;
                            status.textContent = '索引已加载（' + r.count + ' 篇文章）';
                            search(input.value);
                            dbPut(db, { version: version, entries: entries }).then(function () {
                                db.close();
                            }).catch(function () {
                                db.close();
                            });
                        }).catch(function () {
                            status.textContent = '搜索索引加载失败';
                            db.close();
                        });
                    });
                })
                .catch(function () {
                    fetchIndex().then(function (r) {
                        ready = true;
                        status.textContent = '索引已加载（' + r.count + ' 篇文章）';
                        search(input.value);
                    }).catch(function () {
                        status.textContent = '搜索索引加载失败';
                    });
                });
        }

        input.addEventListener('focus', ensureReady);
        input.addEventListener('input', function (e) {
            ensureReady();
            var q = e.target.value;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function () { search(q); }, 150);
        });
    })();
</script>
{{ end }}
