{{ $toc := .TableOfContents }}
{{ if and (eq .Type "post") (gt (len (findRE "<li" $toc)) 0) (ne .Params.toc false) }}
<nav class="toc" id="page-toc" aria-label="目录">
    <h2>目录</h2>
    <div class="toc-body">{{ $toc | safeHTML }}</div>
</nav>
<script>
    (function () {
        var toc = document.getElementById('page-toc');
        if (!toc) return;
        toc.querySelector('h2').addEventListener('click', function () {
            toc.classList.toggle('open');
        });
    })();
</script>
{{ end }}
