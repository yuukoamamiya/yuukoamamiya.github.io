{{ if .Site.Params.googleAnalytics.enabled }}
<!-- Google Analytics：严格延迟（idle/scroll/touch 才触发，不占首屏）。能直连 google 则用官方 gtag.js；
     直连失败（大陆被墙 / 被广告拦截）则改发轻量 beacon 给 CF Worker 转发 GA4 -->
<script>
    (function () {
        var tid = '{{ .Site.Params.googleAnalytics.id }}';
        var api = '{{ .Site.Params.googleAnalytics.proxy }}';
        var fired = false, loaded = false;

        function getSession() {
            var now = Math.floor(Date.now() / 1000);
            var maxAge = 1800;
            try {
                var raw = sessionStorage.getItem('ga-session');
                var saved = raw ? JSON.parse(raw) : null;
                if (saved && saved.id && saved.last && now - saved.last < maxAge) {
                    saved.last = now;
                    saved.seq = (Number(saved.seq) || 0) + 1;
                    sessionStorage.setItem('ga-session', JSON.stringify(saved));
                    return { id: String(saved.id), seq: saved.seq, isNew: false };
                }
                var current = { id: String(now), last: now, seq: 1 };
                sessionStorage.setItem('ga-session', JSON.stringify(current));
                return { id: current.id, seq: current.seq, isNew: true };
            } catch (e) {
                return { id: String(now), seq: 1, isNew: true };
            }
        }

        function sendCF() {
            // 未配置 proxy（自建反代）时跳过 beacon，仅用官方 gtag
            if (fired || !api) return; fired = true;
            var session = getSession();
            var q = 'dt=' + encodeURIComponent(document.title)
                + '&dr=' + encodeURIComponent(document.referrer)
                + '&dl=' + encodeURIComponent(location.href)
                + '&ul=' + encodeURIComponent((navigator.language || '').toLowerCase())
                + '&sr=' + encodeURIComponent(screen.width + 'x' + screen.height)
                + '&sid=' + encodeURIComponent(session.id)
                + '&seq=' + encodeURIComponent(session.seq)
                + '&z=' + Date.now();
            if (session.isNew) q += '&ss=1';
            var img = new Image(); img.src = api + '?' + q;
        }

        function initGtag() {
            if (fired) return; fired = true;
            window.dataLayer = window.dataLayer || [];
            function gtag() { window.dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', tid);
        }

        function loadGA() {
            if (loaded || fired) return; loaded = true;
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + tid;
            s.onload = initGtag;
            s.onerror = sendCF;
            document.head.appendChild(s);
            setTimeout(function () { if (!window.gtag) sendCF(); }, 3000);
        }

        if ('requestIdleCallback' in window) requestIdleCallback(loadGA, { timeout: 4000 });
        else window.setTimeout(loadGA, 2500);
        window.addEventListener('scroll', loadGA, { once: true, passive: true });
        window.addEventListener('touchstart', loadGA, { once: true, passive: true });
    })();
</script>
{{ end }}

{{ if .Site.Params.cloudflareWebAnalytics.enabled }}
<!-- Cloudflare Web Analytics：懒加载（空闲/滚动/触摸才拉 beacon，不抢首屏） -->
<script>
    (function () {
        var loaded = false;
        function loadWA() {
            if (loaded) return; loaded = true;
            var s = document.createElement('script');
            s.defer = true;
            s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            s.setAttribute('data-cf-beacon', '{"token": "{{ .Site.Params.cloudflareWebAnalytics.token }}"}');
            document.head.appendChild(s);
        }
        if ('requestIdleCallback' in window) requestIdleCallback(loadWA, { timeout: 4000 });
        else window.setTimeout(loadWA, 2500);
        window.addEventListener('scroll', loadWA, { once: true, passive: true });
        window.addEventListener('touchstart', loadWA, { once: true, passive: true });
    })();
</script>
{{ end }}
