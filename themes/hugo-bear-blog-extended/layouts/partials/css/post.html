<style>
  /* table of contents —— Worg 风格：桌面悬浮右上角，移动端回落文章顶部 */
  .toc {
    position: fixed;
    right: 0;
    top: 0;
    z-index: 20;
    background: var(--background-color);
    box-shadow: 0 0 1em rgba(0, 0, 0, 0.2);
    border-radius: 0 0 0 5px;
    padding: 0.5em 0.8em;
    font-size: 0.85em;
    line-height: 1.5;
    max-height: 80vh;
    overflow: auto;
  }
  .toc h2 {
    margin: 0;
    font-size: 1em;
    font-weight: normal;
    color: var(--text-color);
    cursor: pointer;
    user-select: none;
  }
  .toc .toc-body {
    display: none;
    text-align: left;
    padding-top: 0.3em;
  }
  .toc:hover .toc-body,
  .toc.open .toc-body {
    display: block;
  }
  .toc ul {
    list-style: none;
    margin: 0;
    padding-left: 1em;
  }
  .toc li { margin: 0.2em 0; }
  .toc a {
    text-decoration: none;
    color: var(--link-color);
  }
  .toc a:hover { text-decoration: underline; }

  /* 移动端：TOC 回到文章顶部内联 */
  @media (max-width: 67em) {
    .toc {
      position: relative;
      right: auto;
      top: auto;
      margin: 0 0 1.5em;
      background: color-mix(in srgb, var(--code-background) 55%, transparent);
      box-shadow: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
  }

  /* blog post list */
  ul.blog-posts { list-style-type: none; padding: unset; }
  ul.blog-posts li { display: flex; margin: 0.3em 0; }
  ul.blog-posts li span { flex: 0 0 130px; }
  ul.blog-posts li a { color: var(--text-color); text-decoration: none; }
  ul.blog-posts li a:hover { color: var(--link-color); text-decoration: underline; }
  ul.blog-posts li a:visited { color: var(--visited-color); }

  /* 友链 */
  .links .link { margin: 1.5em 0; padding-bottom: 1em; border-bottom: 1px dashed var(--border-color); }
  .links .link:last-child { border-bottom: none; }
  .links .link h3 { margin-bottom: 0.3em; }

  /* 文章摘要 */
  .post-description {
    color: var(--muted-color);
    font-style: italic;
    font-size: 1.05em;
    margin: 0.5em 0 1.5em;
    padding-bottom: 0.8em;
    border-bottom: 1px dashed var(--border-color);
  }

  /* 文章底部分类/关键词 */
  .post-meta {
    color: var(--muted-color);
    font-size: 0.9em;
    margin-top: 2em;
  }
  .post-meta a {
    color: var(--muted-color);
    text-decoration: none;
  }
  .post-meta a:hover {
    color: var(--link-color);
    text-decoration: underline;
  }
  .post-meta span {
    margin-right: 1.5em;
  }

  /* 分类/标签列表页 */
  .taxonomy-list { list-style: none; padding: 0; }
  .taxonomy-list li { margin: 0.5em 0; }
  .taxonomy-count { color: var(--muted-color); font-size: 0.85em; margin-left: 0.5em; }
  .taxonomy-description { color: var(--text-color); margin-top: 0; }

  @media (max-width: 480px) {
    ul.blog-posts li { flex-direction: column; gap: 0.1em; }
    ul.blog-posts li span { flex: none; }
  }
</style>
